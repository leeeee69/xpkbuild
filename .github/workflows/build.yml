name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: install theos
        run: |
          export THEOS="$RUNNER_TEMP/theos"
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "$THEOS/bin" >> "$GITHUB_PATH"

      - name: install ldid
        run: |
          brew install ldid
          mkdir -p "$THEOS/bin"
          ln -sf "$(brew --prefix)/bin/ldid" "$THEOS/bin/ldid" || true

      - name: build
        run: |
          make package FINALPACKAGE=1 || make
          find . -name '*.dylib'

      - uses: actions/upload-artifact@v4
        with:
          name: xppanelkit
          path: |
            packages/*.deb
            .theos/obj/**/*.dylib
          if-no-files-found: warn
